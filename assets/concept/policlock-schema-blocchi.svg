<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img">
<title>Schema a blocchi di PoliClock (v0.5)</title>
<desc>La testa contiene display e schedina portadisplay, collegati alla scheda principale con un cavo FFC di circa 12 poli. Il sensore SHT40 nel vano ventilato e il pulsante si collegano alla scheda principale con pochi fili. La scheda principale contiene ESP32-C3, RTC con tampone, driver della retroilluminazione, USB-C con protezioni e regolatore 3,3 V. Sotto, il cavo USB-C sempre collegato dal sedere all'alimentatore. Nessuna batteria nella V1.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
.box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.8; }
.box-t { fill: #2C2C2A; }
.box-s { fill: #5F5E5A; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.lbl { fill: #5F5E5A; }
</style>
<rect width="680" height="570" fill="#FFFFFF"/>
<rect x="40" y="30" width="250" height="150" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="60" y="52" dominant-baseline="central" fill="#085041">Testa</text>
<rect class="box" x="60" y="68" width="210" height="48" rx="8"/>
<text class="th box-t" x="165" y="84" text-anchor="middle" dominant-baseline="central">Display IPS 1,28"</text>
<text class="ts box-s" x="165" y="102" text-anchor="middle" dominant-baseline="central">GC9A01, touch predisposto</text>
<rect class="box" x="60" y="124" width="210" height="44" rx="8"/>
<text class="th box-t" x="165" y="146" text-anchor="middle" dominant-baseline="central">Schedina portadisplay</text>
<rect x="330" y="30" width="150" height="90" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="405" y="62" text-anchor="middle" dominant-baseline="central" fill="#444441">Vano ventilato</text>
<text class="ts" x="405" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">SHT40 mini-PCB</text>
<rect x="500" y="30" width="140" height="90" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="570" y="62" text-anchor="middle" dominant-baseline="central" fill="#444441">Pulsante</text>
<text class="ts" x="570" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">da posizionare</text>
<line class="arr" x1="165" y1="182" x2="165" y2="228" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts lbl" x="175" y="206" dominant-baseline="central">FFC ~12 poli</text>
<line class="arr" x1="405" y1="122" x2="405" y2="228" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts lbl" x="413" y="176" dominant-baseline="central">I²C, 4 fili</text>
<line class="arr" x1="570" y1="122" x2="570" y2="228" marker-end="url(#arrow)"/>
<text class="ts lbl" x="578" y="176" dominant-baseline="central">2 fili</text>
<rect x="40" y="232" width="600" height="190" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="60" y="252" dominant-baseline="central" fill="#3C3489">Scheda principale (busto/base)</text>
<rect class="box" x="70" y="272" width="170" height="56" rx="8"/>
<text class="th box-t" x="155" y="290" text-anchor="middle" dominant-baseline="central">ESP32-C3</text>
<text class="ts box-s" x="155" y="310" text-anchor="middle" dominant-baseline="central">MCU, USB nativa</text>
<rect class="box" x="260" y="272" width="170" height="56" rx="8"/>
<text class="th box-t" x="345" y="290" text-anchor="middle" dominant-baseline="central">RTC + tampone</text>
<text class="ts box-s" x="345" y="310" text-anchor="middle" dominant-baseline="central">ora salva a cavo staccato</text>
<rect class="box" x="450" y="272" width="170" height="56" rx="8"/>
<text class="th box-t" x="535" y="290" text-anchor="middle" dominant-baseline="central">Retroilluminazione</text>
<text class="ts box-s" x="535" y="310" text-anchor="middle" dominant-baseline="central">driver PWM</text>
<rect class="box" x="70" y="346" width="170" height="56" rx="8"/>
<text class="th box-t" x="155" y="364" text-anchor="middle" dominant-baseline="central">USB-C + ESD</text>
<text class="ts box-s" x="155" y="384" text-anchor="middle" dominant-baseline="central">fusibile, CC 5,1 kΩ</text>
<rect class="box" x="260" y="346" width="170" height="56" rx="8"/>
<text class="th box-t" x="345" y="364" text-anchor="middle" dominant-baseline="central">Regolatore 3,3 V</text>
<text class="ts box-s" x="345" y="384" text-anchor="middle" dominant-baseline="central">LDO da 5 V USB</text>
<rect class="box" x="450" y="346" width="170" height="56" rx="8"/>
<text class="th box-t" x="535" y="364" text-anchor="middle" dominant-baseline="central">Connettori</text>
<text class="ts box-s" x="535" y="384" text-anchor="middle" dominant-baseline="central">display, SHT40, pulsante</text>
<line class="arr" x1="155" y1="470" x2="155" y2="426" marker-end="url(#arrow)"/>
<text class="ts lbl" x="163" y="446" dominant-baseline="central">5 V + dati USB</text>
<rect x="70" y="472" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="155" y="490" text-anchor="middle" dominant-baseline="central" fill="#444441">Presa USB-C</text>
<text class="ts" x="155" y="510" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">sul sedere</text>
<line class="arr" x1="398" y1="500" x2="242" y2="500" marker-end="url(#arrow)"/>
<text class="ts lbl" x="320" y="488" text-anchor="middle" dominant-baseline="central">cavo sempre collegato</text>
<rect x="400" y="472" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="510" y="490" text-anchor="middle" dominant-baseline="central" fill="#712B13">Alimentatore USB 5 V</text>
<text class="ts" x="510" y="510" text-anchor="middle" dominant-baseline="central" fill="#993C1D">nessuna batteria in V1</text>
<text class="ts lbl" x="340" y="556" text-anchor="middle">Schema illustrativo v0.5 · fonte normativa: docs/02-architettura-hardware.md</text>
</svg>
